  </pattern>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#02060E" flood-opacity=".35"/>
  </filter>
</defs>
