<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">SVR Forge — DevOps, SRE and Platform Engineering</title>
<desc id="desc">Vignesh Raja Sundararajan. Engineering reliable cloud systems through infrastructure as code, automated delivery and observability.</desc>
<defs>
